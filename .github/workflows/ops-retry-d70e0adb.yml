name: Retry validated full-match job

on:
  push:
    branches:
      - ops/retry-d70e0adb-20260724

permissions:
  contents: read

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_URL: https://algonext-frontend.vercel.app/api/backend
      JOB_ID: d70e0adb-e326-4ce0-b18e-8c49d4d0fccc
      EXPECTED_BACKEND_SHA: 7bc7c583a5a6b31a11cb910d255650d9f84ebe27
    steps:
      - name: Verify matching API and worker
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          with urllib.request.urlopen(f"{os.environ['BASE_URL']}/runtime", timeout=20) as response:
              envelope = json.load(response)
          payload = envelope.get("data") or {}
          worker = payload.get("worker") or {}
          expected = os.environ["EXPECTED_BACKEND_SHA"]
          if payload.get("ready") is not True:
              raise SystemExit(f"runtime not ready: {json.dumps(payload, sort_keys=True)}")
          if payload.get("revision") != expected or worker.get("revision") != expected:
              raise SystemExit(
                  f"revision mismatch expected={expected} api={payload.get('revision')} worker={worker.get('revision')}"
              )
          print(json.dumps(payload, sort_keys=True))
          PY

      - name: Retry the existing job
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          url = f"{os.environ['BASE_URL']}/jobs/{os.environ['JOB_ID']}/retry"
          request = urllib.request.Request(
              url,
              data=b"{}",
              method="POST",
              headers={
                  "Accept": "application/json",
                  "Content-Type": "application/json",
                  "User-Agent": "AlgoNext-Ops-Retry/1.0",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          if payload.get("ok") is not True:
              raise SystemExit(json.dumps(payload, sort_keys=True))
          data = payload.get("data") or {}
          if data.get("status") not in {"QUEUED", "RUNNING", "PROCESSING"}:
              raise SystemExit(f"unexpected retry response: {json.dumps(payload, sort_keys=True)}")
          print(json.dumps(payload, sort_keys=True))
          PY

      - name: Verify the worker accepted the run
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          url = f"{os.environ['BASE_URL']}/jobs/{os.environ['JOB_ID']}/status"
          accepted = {"QUEUED", "RUNNING", "PROCESSING", "COMPLETED", "PARTIAL"}
          latest = None
          for attempt in range(18):
              with urllib.request.urlopen(url, timeout=20) as response:
                  envelope = json.load(response)
              latest = envelope.get("data") or {}
              status = latest.get("status")
              progress = latest.get("progress") or {}
              print(
                  f"attempt={attempt + 1} status={status} step={progress.get('step')} "
                  f"pct={progress.get('pct')} updated_at={progress.get('updated_at')}"
              )
              if status == "FAILED":
                  raise SystemExit(json.dumps(latest, sort_keys=True))
              if status in accepted and progress.get("step") not in {"QUEUED", None}:
                  print(json.dumps(latest, sort_keys=True))
                  raise SystemExit(0)
              time.sleep(10)
          if latest and latest.get("status") in accepted:
              print(json.dumps(latest, sort_keys=True))
              raise SystemExit(0)
          raise SystemExit(f"job was not accepted: {json.dumps(latest, sort_keys=True)}")
          PY
