name: Deploy AlgoNext to VPS

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 45m
          command_timeout: 45m
          script: |
            set -euo pipefail

            cd /opt/AlgoNext

            echo "== DEPLOY START $(date -u) =="

            echo "== git fetch =="
            git fetch origin main

            echo "== git reset --hard origin/main =="
            git reset --hard origin/main

            echo "== git clean =="
            git clean -fd

            export APP_GIT_SHA="$(git rev-parse HEAD)"
            export APP_BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "== revision $APP_GIT_SHA built at $APP_BUILD_TIME =="

            echo "== sealed runtime configuration =="
            SEAL_DIR="/opt/algonext-runtime-secrets"
            SEAL_KEY="$SEAL_DIR/lgi-readonly-seal.pem"
            SEALED_LGI_URL="ops/secrets/lgi-readonly-database-url.enc"
            install -d -m 700 "$SEAL_DIR"
            if [ ! -s "$SEAL_KEY" ]; then
              openssl genpkey \
                -algorithm RSA \
                -pkeyopt rsa_keygen_bits:4096 \
                -out "$SEAL_KEY" >/dev/null 2>&1
              chmod 600 "$SEAL_KEY"
            fi
            if [ -s "$SEALED_LGI_URL" ]; then
              DECRYPTED_LGI_URL="$(mktemp "$SEAL_DIR/lgi-url.XXXXXX")"
              trap 'shred -u "$DECRYPTED_LGI_URL" 2>/dev/null || rm -f "$DECRYPTED_LGI_URL"' EXIT
              openssl pkeyutl \
                -decrypt \
                -inkey "$SEAL_KEY" \
                -pkeyopt rsa_padding_mode:oaep \
                -pkeyopt rsa_oaep_md:sha256 \
                -in "$SEALED_LGI_URL" \
                -out "$DECRYPTED_LGI_URL"
              python scripts/set_secret_env.py \
                /opt/AlgoNext/.env \
                LGI_READONLY_DATABASE_URL < "$DECRYPTED_LGI_URL"
              shred -u "$DECRYPTED_LGI_URL" 2>/dev/null || rm -f "$DECRYPTED_LGI_URL"
              trap - EXIT
              echo "LGI read-only runtime URL installed"
            else
              echo "LGI_SEAL_PUBLIC_KEY_BEGIN"
              openssl pkey -in "$SEAL_KEY" -pubout 2>/dev/null
              echo "LGI_SEAL_PUBLIC_KEY_END"
              echo "LGI read-only ciphertext not present yet"
            fi

            echo "== docker compose pull =="
            docker compose pull || true

            echo "== build (with heartbeat) =="
            (
              while true; do
                echo "[heartbeat] building... $(date -u)"
                sleep 25
              done
            ) &
            HB_PID=$!

            if ! docker compose build; then
              kill $HB_PID || true
              wait $HB_PID 2>/dev/null || true
              echo "== build failed =="
              exit 1
            fi

            kill $HB_PID || true
            wait $HB_PID 2>/dev/null || true

            echo "== up base services =="
            docker compose up -d db redis minio createbuckets

            echo "== migrate =="
            docker compose run --rm migrate

            echo "== up api + worker =="
            docker compose up -d --force-recreate api worker

            echo "== wait for API + worker readiness =="
            READY=0
            for attempt in $(seq 1 60); do
              if docker compose exec -T api python - <<'PY'
            import json
            import sys
            import urllib.request

            try:
                with urllib.request.urlopen("http://127.0.0.1:8000/ready", timeout=3) as response:
                    payload = json.load(response)
                if payload.get("ok") is True and payload.get("status") == "ready":
                    print(json.dumps(payload, sort_keys=True))
                    sys.exit(0)
            except Exception as exc:
                print(f"not ready: {exc}")
            sys.exit(1)
            PY
              then
                READY=1
                break
              fi
              echo "[readiness] attempt $attempt/60"
              sleep 3
            done

            if [ "$READY" != "1" ]; then
              echo "== readiness failed =="
              docker compose ps
              docker compose logs --tail=200 api worker
              exit 1
            fi

            echo "== verify deployed revisions =="
            docker compose exec -T api python - "$APP_GIT_SHA" <<'PY'
            import json
            import sys
            import urllib.request

            expected = sys.argv[1]
            with urllib.request.urlopen("http://127.0.0.1:8000/runtime", timeout=5) as response:
                envelope = json.load(response)
            payload = envelope.get("data") or {}
            api_revision = payload.get("revision")
            worker = payload.get("worker") or {}
            worker_revision = worker.get("revision")
            if api_revision != expected or worker_revision != expected:
                raise SystemExit(
                    f"revision mismatch expected={expected} api={api_revision} worker={worker_revision}"
                )
            print(f"deployed revision verified: {expected}")
            PY

            echo "== DEPLOY END $(date -u) =="
            docker compose ps
