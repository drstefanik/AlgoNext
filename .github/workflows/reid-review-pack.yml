name: Build ReID review pack

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Completed AlgoNext job ID
        required: true
        type: string
      api_base:
        description: Public AlgoNext API base, without /jobs
        required: true
        default: https://algonext-frontend.vercel.app/api/backend
        type: string
      samples_per_window:
        description: Frames extracted for each tracking window
        required: true
        default: "2"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/reid-review-pack.yml"

permissions:
  contents: read
  issues: write

jobs:
  review-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REVIEW_JOB_ID: ${{ inputs.job_id || 'd70e0adb-e326-4ce0-b18e-8c49d4d0fccc' }}
      REVIEW_API_BASE: ${{ inputs.api_base || 'https://algonext-frontend.vercel.app/api/backend' }}
      REVIEW_SAMPLES_PER_WINDOW: ${{ inputs.samples_per_window || '2' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ensure FFmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Download job artifacts and build annotation pack
        run: >-
          python scripts/prepare_reid_job_benchmark.py
          --api-base "$REVIEW_API_BASE"
          --job-id "$REVIEW_JOB_ID"
          --output-dir /tmp/reid-benchmark
          --samples-per-window "$REVIEW_SAMPLES_PER_WINDOW"
          --request-timeout 600

      - name: Validate generated pack
        id: validate
        run: |
          test -f /tmp/reid-benchmark/job-manifest.json
          test -f /tmp/reid-benchmark/tracking.json
          test -f /tmp/reid-benchmark/review-pack/index.html
          test -f /tmp/reid-benchmark/review-pack/reid-window-annotations.json
          test -f /tmp/reid-benchmark/review-pack/frame-annotations.json
          frame_count="$(find /tmp/reid-benchmark/review-pack/frames -type f -name '*.jpg' | wc -l | tr -d ' ')"
          test "$frame_count" -gt 0
          echo "Extracted review frames: $frame_count"
          echo "frame_count=$frame_count" >> "$GITHUB_OUTPUT"
          rm -f /tmp/reid-benchmark/input.mp4

      - name: Upload review pack
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: reid-review-${{ env.REVIEW_JOB_ID }}
          path: |
            /tmp/reid-benchmark/job-manifest.json
            /tmp/reid-benchmark/tracking.json
            /tmp/reid-benchmark/review-pack/**
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Report review-pack run
        if: always()
        uses: actions/github-script@v7
        env:
          RUN_STATUS: ${{ job.status }}
          FRAME_COUNT: ${{ steps.validate.outputs.frame_count || '0' }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url || '' }}
        with:
          script: |
            const issue_number = 148;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const lines = [
              `### ReID review pack: ${process.env.RUN_STATUS}`,
              `- Job: \`${process.env.REVIEW_JOB_ID}\``,
              `- Run: ${runUrl}`,
              `- Frame estratti: ${process.env.FRAME_COUNT || '0'}`,
            ];
            if (process.env.ARTIFACT_URL) {
              lines.push(`- Artifact: ${process.env.ARTIFACT_URL}`);
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: lines.join('\n'),
            });
