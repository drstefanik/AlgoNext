name: ReID production regression

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Preserved AlgoNext job to force-retry
        required: true
        default: 6520b68b-8de6-43b7-88d2-41375bded0a0
        type: string
      api_base:
        description: Public AlgoNext API base, without /jobs
        required: true
        default: https://algonext-frontend.vercel.app/api/backend
        type: string
  push:
    branches:
      - main
    paths:
      - ".github/workflows/reid-production-regression.yml"
      - "app/reid/full_match_runtime.py"
      - "app/reid/team_color_guard.py"
      - "app/reid/windowed_tracking.py"
      - "docker-compose.yml"

permissions:
  contents: read
  issues: write

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 135
    env:
      JOB_ID: ${{ inputs.job_id || '6520b68b-8de6-43b7-88d2-41375bded0a0' }}
      API_BASE: ${{ inputs.api_base || 'https://algonext-frontend.vercel.app/api/backend' }}
      HEALTH_URL: https://algonext-frontend.vercel.app/api/health
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Wait until production runs this exact revision
        run: |
          set -euo pipefail
          for attempt in $(seq 1 150); do
            payload="$(curl -sS --max-time 15 "$HEALTH_URL" || true)"
            ready="$(jq -r '.ok // false' <<<"$payload" 2>/dev/null || echo false)"
            api_revision="$(jq -r '.backend.revision // empty' <<<"$payload" 2>/dev/null || true)"
            worker_revision="$(jq -r '.backend.worker.revision // empty' <<<"$payload" 2>/dev/null || true)"
            echo "[$attempt/150] ready=$ready api=$api_revision worker=$worker_revision expected=$GITHUB_SHA"
            if [ "$ready" = "true" ] && [ "$api_revision" = "$GITHUB_SHA" ] && [ "$worker_revision" = "$GITHUB_SHA" ]; then
              printf '%s\n' "$payload" > /tmp/runtime-health.json
              exit 0
            fi
            sleep 5
          done
          echo "Production did not converge to revision $GITHUB_SHA" >&2
          exit 1

      - name: Force-retry preserved job
        run: |
          set -euo pipefail
          curl -fsS --retry 4 --retry-all-errors --max-time 60 \
            -X POST \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            --data '{"force":true}' \
            "$API_BASE/jobs/$JOB_ID/retry" \
            | tee /tmp/retry-response.json
          status="$(jq -r '.data.status // empty' /tmp/retry-response.json)"
          test "$status" = "QUEUED" -o "$status" = "RUNNING"

      - name: Poll analysis to a terminal state
        id: poll
        run: |
          set -euo pipefail
          terminal=""
          for attempt in $(seq 1 180); do
            curl -fsS --retry 4 --retry-all-errors --max-time 60 \
              "$API_BASE/jobs/$JOB_ID" > /tmp/job-latest.json
            status="$(jq -r '.data.status // "UNKNOWN"' /tmp/job-latest.json)"
            step="$(jq -r '.data.progress.step // "UNKNOWN"' /tmp/job-latest.json)"
            pct="$(jq -r '.data.progress.pct // 0' /tmp/job-latest.json)"
            updated="$(jq -r '.data.progress.updated_at // .data.updated_at // "unknown"' /tmp/job-latest.json)"
            windows="$(jq -r '(.data.progress.stats.windows_completed // 0 | tostring) + "/" + (.data.progress.stats.windows_total // 0 | tostring)' /tmp/job-latest.json)"
            echo "[$attempt/180] status=$status step=$step pct=$pct windows=$windows updated=$updated"
            case "$status" in
              COMPLETED|PARTIAL|DONE|FAILED|WAITING_FOR_PLAYER)
                terminal="$status"
                break
                ;;
            esac
            sleep 30
          done
          if [ -z "$terminal" ]; then
            echo "Analysis did not reach a terminal state" >&2
            exit 1
          fi
          cp /tmp/job-latest.json /tmp/job-final.json
          echo "status=$terminal" >> "$GITHUB_OUTPUT"
          test "$terminal" != "FAILED"

      - name: Validate truthful guarded result
        id: validate
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          envelope = json.loads(Path('/tmp/job-final.json').read_text())
          job = envelope.get('data') or envelope
          result = job.get('result') or {}
          tracking = result.get('tracking') or {}
          summary = tracking.get('reid_summary') or {}
          guard = summary.get('team_color_guard') or {}
          tracking_success = tracking.get('tracking_success')
          anchors_matched = int(tracking.get('anchors_matched') or 0)
          bboxes_count = int(tracking.get('bboxes_count') or 0)

          if job.get('status') == 'WAITING_FOR_PLAYER':
              raise SystemExit('Regression stopped for player reselection')
          if tracking_success is not True:
              raise SystemExit(f'Selected-player tracking did not succeed: {tracking_success!r}')
          if anchors_matched < 1:
              raise SystemExit(f'No manual anchor matched: {anchors_matched}')
          if bboxes_count < 1:
              raise SystemExit(f'No selected-player observations produced: {bboxes_count}')

          forbidden_scores = {
              'match_rating_10': result.get('match_rating_10'),
              'impact_100': result.get('impact_100'),
              'overall_score': result.get('overall_score'),
              'role_score': result.get('role_score'),
          }
          if any(value is not None for value in forbidden_scores.values()):
              raise SystemExit(f'Unvalidated score leaked: {forbidden_scores}')
          if guard.get('version') != 'kit-color-guard-v1':
              raise SystemExit(f'Missing kit-colour guard evidence: {guard}')
          if guard.get('validated') is not False:
              raise SystemExit('Experimental guard must never be marked validated')

          segments = tracking.get('segments') or []
          accepted = [segment for segment in segments if segment.get('bboxes')]
          if not accepted:
              raise SystemExit('No full-match window retained the selected player')
          cross_window = [
              segment
              for segment in accepted
              if str(segment.get('direction') or '').lower() != 'anchor'
          ]
          if not cross_window:
              raise SystemExit(
                  'Only the manual-anchor window was retained; cross-window ReID was not proven'
              )
          rejected = int(guard.get('segments_rejected') or 0)
          status = str(guard.get('status') or summary.get('status') or 'UNKNOWN')
          coverage = float(tracking.get('coverage_pct') or 0.0)
          if status == 'ANCHOR_REJECTED' and accepted:
              raise SystemExit('Anchor rejection must clear every accepted identity link')
          for segment in accepted:
              segment_guard = (segment.get('reid') or {}).get('kit_color_guard')
              if segment_guard and segment_guard.get('passed') is not True:
                  raise SystemExit('A retained segment has a failed kit-colour guard')

          report = {
              'job_id': job.get('job_id') or job.get('id'),
              'status': job.get('status'),
              'guard_status': status,
              'segments_total': tracking.get('segments_total'),
              'segments_with_player': len(accepted),
              'cross_window_segments': len(cross_window),
              'segments_rejected': rejected,
              'anchors_matched': anchors_matched,
              'bboxes_count': bboxes_count,
              'coverage_pct': coverage,
              'anchor_geometry': guard.get('anchor_geometry'),
              'anchor_signature': guard.get('anchor_signature'),
              'warnings': job.get('warnings') or [],
              'scores_withheld': True,
          }
          Path('/tmp/reid-regression-summary.json').write_text(
              json.dumps(report, indent=2, ensure_ascii=False) + '\n'
          )
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as handle:
              handle.write(f"guard_status={status}\n")
              handle.write(f"segments_with_player={len(accepted)}\n")
              handle.write(f"segments_rejected={rejected}\n")
              handle.write(f"coverage_pct={coverage}\n")
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as handle:
              handle.write('## ReID production regression\n\n')
              handle.write('```json\n')
              handle.write(json.dumps(report, indent=2, ensure_ascii=False))
              handle.write('\n```\n')
          PY

      - name: Upload regression evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reid-regression-${{ env.JOB_ID }}-${{ github.sha }}
          path: |
            /tmp/runtime-health.json
            /tmp/retry-response.json
            /tmp/job-final.json
            /tmp/reid-regression-summary.json
          if-no-files-found: warn
          retention-days: 30

      - name: Report regression on benchmark issue
        if: always()
        uses: actions/github-script@v7
        env:
          WORKFLOW_STATUS: ${{ job.status }}
          TERMINAL_STATUS: ${{ steps.poll.outputs.status || 'NOT_COMPLETED' }}
          GUARD_STATUS: ${{ steps.validate.outputs.guard_status || 'NOT_VALIDATED' }}
          SEGMENTS_WITH_PLAYER: ${{ steps.validate.outputs.segments_with_player || '0' }}
          SEGMENTS_REJECTED: ${{ steps.validate.outputs.segments_rejected || '0' }}
          COVERAGE_PCT: ${{ steps.validate.outputs.coverage_pct || '0' }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url || '' }}
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const lines = [
              '### ReID production regression',
              `- Job: \`${process.env.JOB_ID}\``,
              `- Workflow: ${process.env.WORKFLOW_STATUS}`,
              `- Stato job: ${process.env.TERMINAL_STATUS}`,
              `- Guard: ${process.env.GUARD_STATUS}`,
              `- Finestre mantenute: ${process.env.SEGMENTS_WITH_PLAYER}`,
              `- Finestre rifiutate: ${process.env.SEGMENTS_REJECTED}`,
              `- Copertura: ${process.env.COVERAGE_PCT}%`,
              `- Run: ${runUrl}`,
            ];
            if (process.env.ARTIFACT_URL) lines.push(`- Artifact: ${process.env.ARTIFACT_URL}`);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 148,
              body: lines.join('\n'),
            });
