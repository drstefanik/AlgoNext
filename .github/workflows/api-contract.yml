name: API contract

on:
  pull_request:
    paths:
      - "app/core/http_errors.py"
      - "app/core/evaluation_truth.py"
      - "app/core/evaluation_guard.py"
      - "app/core/evaluation_http_guard.py"
      - "app/benchmark/**"
      - "app/reid/**"
      - "app/calibration/**"
      - "app/main.py"
      - "app/workers/celery_app.py"
      - "app/workers/ai_report.py"
      - "docker-compose.yml"
      - "scripts/evaluate_tracking.py"
      - "scripts/convert_tracking_output.py"
      - "scripts/solve_pitch_calibration.py"
      - "scripts/apply_pitch_calibration.py"
      - "tests/test_http_error_contract.py"
      - "tests/test_evaluation_truth.py"
      - "tests/test_evaluation_guard.py"
      - "tests/test_evaluation_report_guard.py"
      - "tests/test_tracking_benchmark.py"
      - "tests/test_tracking_adapter.py"
      - "tests/test_reid_*.py"
      - "tests/test_pitch_calibration*.py"
      - "tests/test_calibrated_kinematics*.py"
      - "tests/fixtures/tracking_benchmark/**"
      - "tests/fixtures/pitch_calibration/**"
      - "docs/pitch_calibration.md"
      - "docs/schemas/pitch-calibration-*.schema.json"
      - ".github/workflows/api-contract.yml"
  push:
    branches:
      - main
    paths:
      - "app/core/http_errors.py"
      - "app/core/evaluation_truth.py"
      - "app/core/evaluation_guard.py"
      - "app/core/evaluation_http_guard.py"
      - "app/benchmark/**"
      - "app/reid/**"
      - "app/calibration/**"
      - "app/main.py"
      - "app/workers/celery_app.py"
      - "app/workers/ai_report.py"
      - "docker-compose.yml"
      - "scripts/evaluate_tracking.py"
      - "scripts/convert_tracking_output.py"
      - "scripts/solve_pitch_calibration.py"
      - "scripts/apply_pitch_calibration.py"
      - "tests/test_http_error_contract.py"
      - "tests/test_evaluation_truth.py"
      - "tests/test_evaluation_guard.py"
      - "tests/test_evaluation_report_guard.py"
      - "tests/test_tracking_benchmark.py"
      - "tests/test_tracking_adapter.py"
      - "tests/test_reid_*.py"
      - "tests/test_pitch_calibration*.py"
      - "tests/test_calibrated_kinematics*.py"
      - "tests/fixtures/tracking_benchmark/**"
      - "tests/fixtures/pitch_calibration/**"
      - "docs/pitch_calibration.md"
      - "docs/schemas/pitch-calibration-*.schema.json"
      - ".github/workflows/api-contract.yml"

permissions:
  contents: read

env:
  DATABASE_URL: sqlite+pysqlite:///:memory:

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight contract dependencies
        run: python -m pip install SQLAlchemy==2.0.32 fastapi==0.115.0

      - name: Compile changed Python modules
        run: >-
          python -m py_compile
          app/core/http_errors.py
          app/core/evaluation_truth.py
          app/core/evaluation_guard.py
          app/core/evaluation_http_guard.py
          app/main.py
          app/workers/celery_app.py
          app/workers/ai_report.py
          tests/test_http_error_contract.py
          tests/test_evaluation_truth.py
          tests/test_evaluation_guard.py
          tests/test_evaluation_report_guard.py

      - name: Run API and evaluation truth contract tests
        run: >-
          python -m unittest
          tests/test_http_error_contract.py
          tests/test_evaluation_truth.py
          tests/test_evaluation_guard.py
          tests/test_evaluation_report_guard.py

  tracking-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile benchmark modules and CLIs
        run: >-
          python -m py_compile
          app/benchmark/__init__.py
          app/benchmark/schema.py
          app/benchmark/tracking_metrics.py
          app/benchmark/adapters.py
          scripts/evaluate_tracking.py
          scripts/convert_tracking_output.py
          tests/test_tracking_benchmark.py
          tests/test_tracking_adapter.py

      - name: Run tracking metric and adapter tests
        run: >-
          python -m unittest
          tests/test_tracking_benchmark.py
          tests/test_tracking_adapter.py

      - name: Run benchmark CLI quality-gate smoke test
        run: >-
          python scripts/evaluate_tracking.py
          --annotations tests/fixtures/tracking_benchmark/annotations
          --predictions tests/fixtures/tracking_benchmark/predictions
          --json-out /tmp/tracking-benchmark.json
          --fail-on-gate

  player-reid:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ReID test dependencies
        run: >-
          python -m pip install
          numpy==1.26.4
          opencv-python-headless==4.10.0.84

      - name: Compile ReID modules and tests
        run: >-
          python -m py_compile
          app/reid/__init__.py
          app/reid/appearance.py
          app/reid/association.py
          app/reid/window_logic.py
          app/reid/runtime.py
          app/reid/windowed_tracking.py
          tests/test_reid_appearance.py
          tests/test_reid_association.py
          tests/test_reid_window_logic.py
          tests/test_reid_runtime.py
          tests/test_reid_windowed_tracking.py

      - name: Run ReID foundation and activation tests
        run: >-
          python -m unittest
          tests/test_reid_appearance.py
          tests/test_reid_association.py
          tests/test_reid_window_logic.py
          tests/test_reid_runtime.py
          tests/test_reid_windowed_tracking.py

      - name: Validate Compose kill-switch configuration
        run: docker compose config >/dev/null

  pitch-calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install calibration test dependencies
        run: >-
          python -m pip install
          numpy==1.26.4
          opencv-python-headless==4.10.0.84

      - name: Compile calibration modules, CLIs and tests
        run: >-
          python -m py_compile
          app/calibration/__init__.py
          app/calibration/model.py
          app/calibration/schema.py
          app/calibration/homography.py
          app/calibration/kinematics.py
          scripts/solve_pitch_calibration.py
          scripts/apply_pitch_calibration.py
          tests/test_pitch_calibration.py
          tests/test_pitch_calibration_guards.py
          tests/test_calibrated_kinematics.py
          tests/test_calibrated_kinematics_guards.py

      - name: Run pitch calibration and kinematics tests
        run: >-
          python -m unittest
          tests/test_pitch_calibration.py
          tests/test_pitch_calibration_guards.py
          tests/test_calibrated_kinematics.py
          tests/test_calibrated_kinematics_guards.py

      - name: Run pitch calibration quality-gate smoke test
        run: >-
          python scripts/solve_pitch_calibration.py
          --input tests/fixtures/pitch_calibration/exact-full-pitch.json
          --output /tmp/pitch-calibration.json
          --fail-on-gate

      - name: Run calibrated motion CLI smoke test
        run: >-
          python scripts/apply_pitch_calibration.py
          --tracking tests/fixtures/pitch_calibration/tracking-linear.json
          --calibration /tmp/pitch-calibration.json
          --output /tmp/calibrated-motion.json
          --minimum-points 10
          --fail-if-unavailable
