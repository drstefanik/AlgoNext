name: Evaluation truth contract

on:
  pull_request:
    paths:
      - "app/core/evaluation_truth.py"
      - "app/workers/pipeline.py"
      - "app/api.py"
      - "tests/test_evaluation_truth.py"
      - ".github/workflows/evaluation-truth.yml"
  push:
    branches:
      - main
    paths:
      - "app/core/evaluation_truth.py"
      - "app/workers/pipeline.py"
      - "app/api.py"
      - "tests/test_evaluation_truth.py"
      - ".github/workflows/evaluation-truth.yml"

permissions:
  contents: read

jobs:
  truth-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile truth contract
        run: python -m py_compile app/core/evaluation_truth.py tests/test_evaluation_truth.py

      - name: Run truth contract tests
        run: python -m unittest tests/test_evaluation_truth.py
