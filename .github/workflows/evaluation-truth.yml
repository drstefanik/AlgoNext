name: Evaluation truth contract

on:
  pull_request:
    paths:
      - "app/core/evaluation_truth.py"
      - "app/core/evaluation_guard.py"
      - "app/core/evaluation_http_guard.py"
      - "app/main.py"
      - "app/workers/ai_report.py"
      - "tests/test_evaluation_truth.py"
      - "tests/test_evaluation_guard.py"
      - "tests/test_evaluation_report_guard.py"
      - "tests/test_async_report.py"
      - ".github/workflows/evaluation-truth.yml"
  push:
    branches:
      - main
      - agent/evaluation-truth-gate
    paths:
      - "app/core/evaluation_truth.py"
      - "app/core/evaluation_guard.py"
      - "app/core/evaluation_http_guard.py"
      - "app/main.py"
      - "app/workers/ai_report.py"
      - "tests/test_evaluation_truth.py"
      - "tests/test_evaluation_guard.py"
      - "tests/test_evaluation_report_guard.py"
      - "tests/test_async_report.py"
      - ".github/workflows/evaluation-truth.yml"

permissions:
  contents: read

env:
  DATABASE_URL: "sqlite+pysqlite:///:memory:"

jobs:
  truth-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight test dependencies
        run: >-
          python -m pip install
          SQLAlchemy==2.0.32
          fastapi==0.115.0
          requests==2.32.3
          boto3==1.34.162
          openai==1.51.0

      - name: Compile truth guard modules
        run: >-
          python -m py_compile
          app/core/evaluation_truth.py
          app/core/evaluation_guard.py
          app/core/evaluation_http_guard.py
          app/main.py
          app/workers/ai_report.py
          tests/test_evaluation_truth.py
          tests/test_evaluation_guard.py
          tests/test_evaluation_report_guard.py
          tests/test_async_report.py

      - name: Run truth contract tests
        run: |
          set -euo pipefail
          export PYTHONPATH="${GITHUB_WORKSPACE}"
          python tests/test_evaluation_truth.py
          python tests/test_evaluation_guard.py
          python tests/test_evaluation_report_guard.py
          python - <<'PY'
          import runpy
          import sys
          import types

          class LightweightCelery:
              def task(self, *_args, **_kwargs):
                  return lambda function: function

          sys.modules["app.workers.celery_app"] = types.SimpleNamespace(
              celery=LightweightCelery()
          )
          runpy.run_path("tests/test_async_report.py", run_name="__main__")
          PY
