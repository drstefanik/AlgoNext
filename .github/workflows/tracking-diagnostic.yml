name: Inspect AlgoNext tracking logs

on:
  push:
    branches: ["ops/storage-incident-20260926"]
    paths: [".github/workflows/tracking-diagnostic.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read worker failures and current capacity
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 2m
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd /opt/AlgoNext
            date -u
            df -hT /var/lib/docker
            docker compose ps
            docker stats --no-stream --format '{{.Name}} {{.MemUsage}} {{.CPUPerc}}'
            python3 - <<'PY'
            import re
            import subprocess
            from collections import deque

            pattern = re.compile(
                r'796f8c0f|6520b68b|92f4305d|bef51736|jersey|'
                r'error|exception|traceback|osnet|reid|anchor|guard|'
                r'no space|out of memory|FATAL|PANIC', re.I
            )
            command = ['docker', 'compose', 'logs', '--no-color', '--since=20m',
                       '--tail=3000', 'worker', 'api', 'db', 'redis']
            output = subprocess.run(command, capture_output=True, text=True, check=True).stdout
            selected = deque(maxlen=180)
            following = 0
            for line in output.splitlines():
                matched = bool(pattern.search(line))
                if matched or following:
                    if '[parameters:' in line or '[SQL:' in line:
                        line = '[SQL parameters and statements omitted]'
                    line = re.sub(r'(?:https?|redis|postgresql(?:\+\w+)?):[^\s\"\']+', '[URL omitted]', line)
                    line = re.sub(r'(?i)(password|token|secret|api_key)([=:]\s*)[^\s,;]+', r'\1\2[redacted]', line)
                    selected.append(line[:900])
                following = 12 if matched and re.search(r'error|exception|traceback', line, re.I) else max(0, following - 1)
            print('\n'.join(selected))
            PY
# Observe requested player attempt 92f4305d on jersey release 2b914ce

# Verify deployed hybrid jersey attempt 8212e41c on release 2b619dd
