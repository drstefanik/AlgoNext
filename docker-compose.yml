services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API (USATO PER VIDEO/CLIP/FRAME)
      - "9001:9001" # Console (SOLO UI)
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Crea automaticamente il bucket (evita NoSuchBucket)
  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_BUCKET: fnh
      # mc supporta MC_HOST_<alias>=http://user:pass@host:port
      MC_HOST_local: http://minioadmin:minioadmin@minio:9000
    entrypoint: ["/bin/sh", "-lc"]
    command: >
      "
      mc mb -p local/$MINIO_BUCKET || true
      cat << 'EOF' > /tmp/cors.json
      [
        {
          \"AllowedOrigins\": [\"https://algonext-frontend.vercel.app\"],
          \"AllowedMethods\": [\"GET\", \"HEAD\"],
          \"AllowedHeaders\": [\"*\"],
          \"ExposeHeaders\": [\"ETag\", \"Content-Length\", \"Content-Type\"],
          \"MaxAgeSeconds\": 3000
        }
      ]
      EOF
      mc cors set local/$MINIO_BUCKET /tmp/cors.json
      cat << 'EOF' > /tmp/policy.json
      {
        \"Version\": \"2012-10-17\",
        \"Statement\": [
          {
            \"Sid\": \"AllowFramesReadOnly\",
            \"Effect\": \"Allow\",
            \"Principal\": {
              \"AWS\": [\"*\"]
            },
            \"Action\": [\"s3:GetObject\"],
            \"Resource\": [
              \"arn:aws:s3:::fnh/jobs/*/frames/*\",
              \"arn:aws:s3:::fnh/jobs/*/candidates/*\"
            ]
          }
        ]
      }
      EOF
      mc anonymous set-json /tmp/policy.json local/$MINIO_BUCKET
      "
    restart: "no"

  api:
    build:
      context: .
      target: api
      args:
        APP_GIT_SHA: ${APP_GIT_SHA:-unknown}
        APP_BUILD_TIME: ${APP_BUILD_TIME:-unknown}
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/app
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      MINIO_BUCKET: fnh
      TRACKING_TIMEOUT_SECONDS: "3600"
      CHECK_WORKER_READINESS: "1"
      WORKER_HEARTBEAT_MAX_AGE_SECONDS: "60"
      MAX_JOB_RETRIES: "3"

      # OpenAI (valore preso da .env sul server)
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      OPENAI_MODEL: ${OPENAI_MODEL}

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()\"",
        ]
      interval: 10s
      timeout: 3s
      retries: 12

  migrate:
    build:
      context: .
      target: migrate
      args:
        APP_GIT_SHA: ${APP_GIT_SHA:-unknown}
        APP_BUILD_TIME: ${APP_BUILD_TIME:-unknown}
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/app
      MINIO_BUCKET: fnh
    depends_on:
      db:
        condition: service_healthy
    command: alembic upgrade head
    restart: "no"

  worker:
    build:
      context: .
      target: worker
      args:
        APP_GIT_SHA: ${APP_GIT_SHA:-unknown}
        APP_BUILD_TIME: ${APP_BUILD_TIME:-unknown}
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/app
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      MINIO_BUCKET: fnh
      TRACKING_TIMEOUT_SECONDS: "3600"
      PLAYER_REID_ENABLED: "${PLAYER_REID_ENABLED:-1}"
      PLAYER_REID_FAIL_OPEN: "${PLAYER_REID_FAIL_OPEN:-1}"
      PLAYER_REID_DESCRIPTOR_BACKEND: "${PLAYER_REID_DESCRIPTOR_BACKEND:-osnet_hybrid}"
      PLAYER_REID_OSNET_MODEL_PATH: "${PLAYER_REID_OSNET_MODEL_PATH:-/opt/algonext-models/osnet_x0_25_msmt17_combineall_256x128_amsgrad_ep150_stp60_lr0.0015_b64_fb10_softmax_labelsmooth_flip_jitter.pth}"
      PLAYER_REID_LEARNED_FAIL_OPEN: "${PLAYER_REID_LEARNED_FAIL_OPEN:-1}"
      BALL_TRACKING_ENABLED: "${BALL_TRACKING_ENABLED:-1}"
      BALL_TRACKING_MIN_CONFIDENCE: "${BALL_TRACKING_MIN_CONFIDENCE:-0.10}"
      WORKER_HEARTBEAT_INTERVAL_SECONDS: "15"
      WORKER_HEARTBEAT_TTL_SECONDS: "90"
      RECOVER_INTERRUPTED_JOBS_ON_WORKER_START: "${RECOVER_INTERRUPTED_JOBS_ON_WORKER_START:-0}"
      INTERRUPTED_JOB_STALE_AFTER_SECONDS: "${INTERRUPTED_JOB_STALE_AFTER_SECONDS:-21600}"
      INTERRUPTED_JOB_PROBE_GRACE_SECONDS: "${INTERRUPTED_JOB_PROBE_GRACE_SECONDS:-900}"
      WORKER_CONCURRENCY: "${WORKER_CONCURRENCY:-1}"

      # CPU budget for full-match tracking. Long matches default to a bounded
      # two-frame-per-second small-model profile instead of the historic fixed
      # 5 FPS profile that exceeded the one-hour timeout.
      FULL_MATCH_TARGET_SAMPLES: "${FULL_MATCH_TARGET_SAMPLES:-12000}"
      FULL_MATCH_MIN_FPS: "${FULL_MATCH_MIN_FPS:-1}"
      FULL_MATCH_MAX_FPS: "${FULL_MATCH_MAX_FPS:-2}"
      FULL_MATCH_WINDOW_SEC: "${FULL_MATCH_WINDOW_SEC:-60}"
      FULL_MATCH_OVERLAP_SEC: "${FULL_MATCH_OVERLAP_SEC:-5}"
      FULL_MATCH_DETECTOR_MODEL: "${FULL_MATCH_DETECTOR_MODEL:-yolo11s.pt}"
      PLAYER_REID_ANCHOR_FPS: "${PLAYER_REID_ANCHOR_FPS:-5}"
      PLAYER_REID_ANCHOR_DETECTOR_MODEL: "${PLAYER_REID_ANCHOR_DETECTOR_MODEL:-yolo11s.pt}"
      PLAYER_REID_MAX_CANDIDATES: "${PLAYER_REID_MAX_CANDIDATES:-4}"
      PLAYER_REID_SAMPLES_PER_CANDIDATE: "${PLAYER_REID_SAMPLES_PER_CANDIDATE:-3}"

      # OpenAI (valore preso da .env sul server)
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      OPENAI_MODEL: ${OPENAI_MODEL}

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    command: >-
      celery -A app.workers.celery_app.celery worker
      --loglevel=info
      --concurrency=${WORKER_CONCURRENCY:-1}
      --prefetch-multiplier=1
    restart: unless-stopped

volumes:
  db_data:
  minio_data:
